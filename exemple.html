<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Journal de coulage · Exemple Gouzeaucourt</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Coulage WTG">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A0E22" media="(prefers-color-scheme: dark)">
<style>
/* Layout: one-column phone app. White EDF header with orange rule, scrolling view, navy 5-tab bar, bottom sheets for forms.
   Identity from the EDF power solutions templates: Arial, navy #001A70, blue #1057C8, orange #FE5815, light grey #F8F7F7. */
:root{
 --bg:#F8F7F7; --card:#FFFFFF; --ink:#333333; --mut:#666B73; --line:#DADBDE; --head:#001A70;
 --b-blue:#1057C8; --b-orange:#FE5815; --b-green:#4F9E30; --brand:var(--b-blue); --brand-ink:#FFFFFF; --accent:#FE5815;
 --ok:#2B7A1A; --ok-bg:#E3F2DC; --nok:#B3261E; --nok-bg:#FBE3E0; --warn:#9A4300; --warn-bg:#FFE8D4; --na:#5F6368; --na-bg:#ECECEE;
 --bar:#FFFFFF; --bar-ink:#001A70; --tabs:#001A70; --tabs-ink:#FFFFFF; --lgl:block; --lgd:none;
 --f:Arial,Helvetica,'Liberation Sans',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#0D1126; --card:#151B38; --ink:#E6E8F2; --mut:#A0A7C2; --line:#2A3157; --head:#B9CBFF;
 --b-blue:#5B97FF; --b-orange:#FF7A3D; --b-green:#8BD35C; --brand-ink:#0B1030; --accent:#FF7A3D;
 --ok:#7BD35A; --ok-bg:#16301A; --nok:#FF8F86; --nok-bg:#3A1B1A; --warn:#FFB26B; --warn-bg:#3B2410; --na:#B4B9C9; --na-bg:#242A4A;
 --bar:#0A0E22; --bar-ink:#FFFFFF; --tabs:#070A1B; --lgl:none; --lgd:block; color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#0D1126; --card:#151B38; --ink:#E6E8F2; --mut:#A0A7C2; --line:#2A3157; --head:#B9CBFF;
 --b-blue:#5B97FF; --b-orange:#FF7A3D; --b-green:#8BD35C; --brand-ink:#0B1030; --accent:#FF7A3D;
 --ok:#7BD35A; --ok-bg:#16301A; --nok:#FF8F86; --nok-bg:#3A1B1A; --warn:#FFB26B; --warn-bg:#3B2410; --na:#B4B9C9; --na-bg:#242A4A;
 --bar:#0A0E22; --bar-ink:#FFFFFF; --tabs:#070A1B; --lgl:none; --lgd:block; color-scheme:dark}
:root[data-brand="orange"]{--brand:var(--b-orange)}
:root[data-brand="green"]{--brand:var(--b-green)}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.4 var(--f);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
#app{max-width:600px;margin:0 auto;height:100%;height:100dvh;display:flex;flex-direction:column;position:relative;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.mono{font-variant-numeric:tabular-nums}
.top{background:var(--bar);color:var(--bar-ink);border-bottom:3px solid var(--accent);padding:calc(9px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-left,0px)) 9px max(14px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:10px;flex:none}
.top h1{font:700 19px/1.1 var(--f);margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1 small{display:block;font:400 11px/1.3 var(--f);opacity:.75;margin-top:3px;overflow:hidden;text-overflow:ellipsis}
select{text-overflow:ellipsis;min-width:0;max-width:100%}
.top button{flex:none}
.lg-l{display:var(--lgl)}.lg-d{display:var(--lgd)}
.top img{height:34px;width:auto;flex:none}
.top.home img{height:44px}
.top.home .sp{flex:1}
.ib{background:transparent;border:1px solid var(--line);color:inherit;border-radius:4px;min-width:40px;height:40px;padding:0 10px;font:700 13px var(--f)}
.ib.hot{background:var(--nok);border-color:var(--nok);color:#fff}
main{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:14px max(16px,env(safe-area-inset-left,0px)) 24px max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
nav.tabs{flex:none;display:grid;grid-template-columns:repeat(5,1fr);background:var(--tabs);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{background:none;border:0;color:var(--tabs-ink);opacity:.66;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font:700 10.5px var(--f);position:relative}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-selected=true]{opacity:1;box-shadow:inset 0 3px 0 var(--accent)}
nav.tabs .dot{position:absolute;top:5px;right:calc(50% - 20px);min-width:16px;height:16px;border-radius:8px;background:var(--accent);color:#fff;font:700 10px/16px var(--f);text-align:center;padding:0 4px}
h2{font:700 22px/1.15 var(--f);color:var(--head);margin:6px 0 0}
h3{font:700 12px/1.2 var(--f);letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:10px 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.mut{color:var(--mut)}
.small{font-size:12.5px}
.btn{background:var(--brand);color:var(--brand-ink);border:0;border-radius:4px;min-height:46px;padding:0 16px;font:700 15px var(--f)}
.btn.sec{background:transparent;color:var(--head);border:1.5px solid var(--head)}
.btn.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--line)}
.btn.red{background:var(--nok);color:#fff}
.btn.full{width:100%}
.btn:disabled{opacity:.4}
.pill{display:inline-block;border-radius:3px;padding:2px 7px;font:700 10.5px/1.5 var(--f);letter-spacing:.03em;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.nok{background:var(--nok-bg);color:var(--nok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.na{background:var(--na-bg);color:var(--na)}
.pill.pa{background:var(--head);color:var(--bg)}
.pill.tag{border:1px solid var(--line);color:var(--mut);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--brand);border-radius:6px;padding:9px 10px;min-width:0}
.kpi b{display:block;font:700 28px/1.05 var(--f);color:var(--head);font-variant-numeric:tabular-nums}
.kpi span{font:600 10.5px var(--f);color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.kpi.bad{border-top-color:var(--nok)} .kpi.bad b{color:var(--nok)} .kpi.good{border-top-color:var(--ok)} .kpi.good b{color:var(--ok)}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand)}
.alert{display:flex;gap:8px;align-items:flex-start;border-radius:6px;padding:9px 11px;font-size:13.5px}
.alert.nok{background:var(--nok-bg);color:var(--nok)} .alert.warn{background:var(--warn-bg);color:var(--warn)} .alert.ok{background:var(--ok-bg);color:var(--ok)}
.item{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:6px;padding:11px 12px;display:flex;flex-direction:column;gap:9px}
.item.s-ok{border-left-color:var(--ok)} .item.s-nok{border-left-color:var(--nok)} .item.s-na{border-left-color:var(--na)}
.item p{margin:0}
.req{font:400 12.5px var(--f);color:var(--mut)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{min-height:44px;border-radius:4px;border:1.5px solid var(--line);background:transparent;font:700 14px var(--f)}
.seg button[data-v=ok][aria-pressed=true]{background:var(--ok);border-color:var(--ok);color:#fff}
.seg button[data-v=nok][aria-pressed=true]{background:var(--nok);border-color:var(--nok);color:#fff}
.seg button[data-v=na][aria-pressed=true]{background:var(--na);border-color:var(--na);color:#fff}
.xseg button[aria-pressed=true]{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:700}
.phg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.phs{position:relative;padding:0;border:2px solid var(--line);border-radius:6px;background:var(--card,#fff);overflow:hidden;text-align:left;opacity:.55;cursor:pointer}
.phs.on{border-color:var(--brand);opacity:1}
.phs img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.phs i{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:var(--brand);color:#fff;font:700 14px/22px var(--f);text-align:center;font-style:normal}
.phs:not(.on) i{background:rgba(0,0,0,.35)}
.phs span{position:absolute;left:4px;top:4px;background:var(--accent);color:#fff;font:700 9px var(--f);padding:2px 5px;border-radius:3px;text-transform:uppercase}
.phs small{display:block;padding:4px 5px;font:400 10px/1.25 var(--f);height:2.6em;overflow:hidden}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs img,.thumbs .ph{width:64px;height:64px;object-fit:cover;border-radius:4px;border:1px solid var(--line);background:var(--na-bg)}
.cam{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border:1.5px dashed var(--brand);border-radius:4px;color:var(--brand);font:700 13.5px var(--f);background:transparent}
.cam.need{border-color:var(--nok);color:var(--nok)}
.cam svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}
label.f{display:flex;flex-direction:column;gap:3px;font:700 10.5px var(--f);color:var(--mut);text-transform:uppercase;letter-spacing:.04em;min-width:0}
.in{width:100%;min-height:44px;border:1.5px solid var(--line);border-radius:4px;background:var(--card);padding:8px 10px;font:400 16px var(--f);color:var(--ink);text-transform:none;letter-spacing:0;font-variant-numeric:tabular-nums}
textarea.in{min-height:64px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.sheet-bg{position:absolute;inset:0;background:#0009;z-index:20;display:flex;align-items:flex-end}
.sheet{background:var(--bg);width:100%;max-height:92%;overflow-y:auto;border-radius:10px 10px 0 0;border-top:4px solid var(--accent);padding:14px max(16px,env(safe-area-inset-left,0px)) 0 max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px;min-height:0}
.sf{position:sticky;bottom:0;background:var(--bg);padding:10px 0 calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);flex:none}
.sheet h2{margin:0}
.truck{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px 12px;align-items:center;text-align:left;width:100%}
.truck .n{font:700 24px/1 var(--f);color:var(--head);grid-row:span 2;min-width:32px;text-align:center}
.truck.rej{border-color:var(--nok);background:var(--nok-bg)}
.chips{display:flex;gap:5px;flex-wrap:wrap;grid-column:2/4}
.sigpad{width:100%;height:120px;background:#fff;border:1.5px solid var(--line);border-radius:4px;touch-action:none;display:block}
.toast{pointer-events:none;position:absolute;left:16px;right:16px;bottom:78px;background:var(--head);color:var(--bg);border-radius:4px;padding:11px 14px;z-index:40;font-size:14px}
.series{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.series button{background:var(--card);border:1.5px solid var(--line);border-radius:6px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:1px}
.series button b{font:700 22px/1 var(--f);color:var(--head)}
.series button.done{border-color:var(--ok);background:var(--ok-bg)}
details summary{cursor:pointer;font:700 13px var(--f);color:var(--brand);min-height:32px;display:flex;align-items:center}
.brandpick{display:flex;gap:10px;align-items:center}
.brandpick button{width:34px;height:34px;border-radius:4px;border:2px solid var(--line)}
.brandpick button[aria-pressed=true]{outline:3px solid var(--head);outline-offset:2px}
.rp{background:#fff;color:#222;border-radius:4px;padding:14px;font:13px/1.4 Arial,sans-serif;border:1px solid var(--line)}
.rp h4{font:700 14px Arial,sans-serif;color:#001A70;margin:14px 0 5px;border-bottom:2px solid #FE5815;padding-bottom:2px}
.rp table{width:100%;border-collapse:collapse;font-size:12px}
.rp td,.rp th{border:1px solid #bbb;padding:3px 5px;text-align:left;vertical-align:top}
.rp th{background:#001A70;color:#fff}
.rp .tw{overflow-x:auto}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.4}}}
@media (min-width:700px){html{background:#dfe3ea}#app{box-shadow:0 0 0 1px #c9ced8,0 8px 30px rgba(0,26,112,.18);max-width:430px}}
html{-webkit-text-size-adjust:100%;overscroll-behavior:none}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
</style>
</head>

const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?null:n};
const f1=n=>n==null?'–':(Math.round(n*10)/10).toString().replace('.',',');
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};

function truckFlags(p,t,i){
 const th=p.th,f=[];
 const dtl=dmin(t.tload,t.tend);
 if(dtl!=null&&dtl>th.dt)f.push({k:'dt',m:`Chargement → mise en place ${hm(dtl)} (> ${hm(th.dt)})`});
 const prev=i>0?p.trucks[i-1]:null;
 if(prev){const g=dmin(prev.tarr,t.tarr);if(g!=null&&g>th.gap)f.push({k:'gap',m:`Écart ${g} min depuis la toupie précédente (> ${th.gap} min)`})}
 const sl=num(t.slump);
 if(sl!=null&&(sl<th.slumpMin||sl>th.slumpMax))f.push({k:'slump',m:`Affaissement ${sl} mm hors ${th.slumpMin}–${th.slumpMax} mm (S3)`});
 if(t.status==='rej')f.push({k:'rej',m:'Chargement rejeté'});
 return f;
}
function testDue(p,t,i){
 // fresh-concrete test every N trucks (1st, 4th, 7th...) and after any rejection until a conforming test
 const e=p.th.every;let due=(i%e===0);
 for(let j=i-1;j>=0;j--){const q=p.trucks[j];if(q.status==='rej'){due=true;break}if(num(q.slump)!=null&&!truckFlags(p,q,j).some(x=>x.k==='slump'))break}
 return due;
}
function stats(p){
 const ok=p.trucks.filter(t=>t.status!=='rej');
 const vol=ok.reduce((a,t)=>a+(num(t.vol)||0),0);
 const first=p.trucks.find(t=>t.tarr),last=[...p.trucks].reverse().find(t=>t.tend||t.tarr);
 let el=null;if(first&&last)el=dmin(first.tarr,last.tend||last.tarr);
 const flow=(el&&el>0&&p.trucks.length>1)?vol/(el/60):null;
 const plan=(num(p.volA)||0)+(num(p.volF)||0);
 const left=plan?Math.max(0,plan-vol):null;
 const eta=(flow&&left!=null)?Math.round(left/flow*60):null;
 let n=p.trucks.length,vv=vol,ee=el,ff=flow;
 const lb=p.lab||{},ln=(num(lb.n)||0)+(num(lb.nF)||0)||null,lv=(num(lb.vol)||0)+(num(lb.volF)||0)||null;
 if(ln&&lv&&ln>=n){n=ln;vv=lv;if(lb.first&&lb.last){const e2=dmin(lb.first,lb.last);if(e2>0)ee=e2}ff=(ee&&ee>0&&n>1)?vv/(ee/60):null}
 const left2=plan?Math.max(0,plan-vv):null,eta2=(ff&&left2!=null)?Math.round(left2/ff*60):null;
 return {vol:vv,el:ee,flow:ff,plan,left:left2,eta:eta2,n,rej:p.trucks.length-ok.length,lab:!!(ln&&lv&&ln>=p.trucks.length)};
}
function itemState(p,id){const o=(id[0]==='g'?p.gate:p.chk)[id];return o||{}}
function ncList(p){
 const out=[];
 ALL.forEach(i=>{const s=itemState(p,i[0]);if(s.s==='nok')out.push({ref:i[0],src:(i[0][0]==='g'?'Prérequis':'Contrôle'),text:i[1],obs:s.obs||'',ph:s.ph||[]})});
 p.trucks.forEach((t,i)=>truckFlags(p,t,i).forEach(f=>out.push({ref:'T'+t.n,src:'Toupie '+t.n+' · BL '+(t.bl||'–'),text:f.m,obs:t.note||'',ph:t.ph||[]})));
 const th=p.thermal,tm=num(th.tmax),dT=num(th.dT);
 if(tm!=null&&tm>p.th.coreMax)out.push({ref:'TH',src:'Thermique',text:`T max cœur ${f1(tm)} °C > ${p.th.coreMax} °C : informer le MOE, suspendre les coulages (CCTP §7.11.2)`,obs:'',ph:[]});
 if(dT!=null&&dT>p.th.dTmax)out.push({ref:'TH',src:'Thermique',text:`ΔT cœur / peau ${f1(dT)} °C > ${p.th.dTmax} °C`,obs:'',ph:[]});
 const g=p.gate.g18||{},a=num(g.v1),b=num(g.v2);
 if((a!=null&&a<p.th.tmin)||(b!=null&&b>p.th.tmax))out.push({ref:'g18',src:'Météo',text:`T° extérieure ${a??'–'} / ${b??'–'} °C hors ${p.th.tmin}–${p.th.tmax} °C : procédure temps froid / chaud à appliquer`,obs:'',ph:[]});
 p.inc.filter(x=>x.nc).forEach(x=>out.push({ref:'I',src:'Incident '+x.t,text:x.cause,obs:'',ph:x.ph||[]}));
 const s=stats(p);
 if(s.flow!=null&&s.n>=3&&s.flow<p.th.flow)out.push({ref:'F',src:'Cadence',text:`Débit moyen ${f1(s.flow)} m³/h < ${p.th.flow} m³/h exigés`,obs:'',ph:[]});
 return out;
}
function progress(p){

 return {g,c,missing};
}

function readImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const im=new Image();im.onload=()=>{URL.revokeObjectURL(u);res(im)};im.onerror=rej;im.src=u})}
async function makePhoto(file,label,o){o=o||{};
 const im=await readImg(file);const M=o.doc?2200:1280;let w=im.naturalWidth,h=im.naturalHeight;const k=Math.min(1,M/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
 const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(im,0,0,w,h);
 if(o.doc)return c.toDataURL('image/jpeg',.82);
 const fs=Math.max(14,Math.round(w/46)),bh=fs*2.1;x.fillStyle='rgba(15,18,20,.78)';x.fillRect(0,h-bh,w,bh);
 x.fillStyle='#fff';x.font=`500 ${fs}px "IBM Plex Mono",monospace`;x.textBaseline='middle';
 const d=new Date(),ts=pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()+' '+pad(d.getHours())+':'+pad(d.getMinutes());
 const p=P();x.fillText(`WTG ${p?p.wtg:''} · ${ts} · ${label}`.slice(0,90),fs*.6,h-bh/2);
 return c.toDataURL('image/jpeg',.72);
}

// ---------- photo selection for the report ----------
// every photo gets a score; the best PH_MAX are pre-selected, the user can override each one (p.phSel[id]=true|false)
const PH_MAX=12;
function phList(p){
 const out=[];let ord=0;
 const add=(ids,label,score,cat)=>(ids||[]).forEach(id=>{if(PH[id])out.push({id,label,score,cat,ord:ord++})});
 ALL.forEach(i=>{const st=itemState(p,i[0]);
  let sc=30;if(i[4]==='r')sc=70;if(i[5]==='pa')sc=Math.max(sc,80);if(st.s==='nok')sc=95;
  add(st.ph,i[0]+' · '+i[1],sc,st.s==='nok'?'NC':(i[0][0]==='g'?'Prérequis':'Contrôle'))});
 p.trucks.forEach((t,k)=>{const fl=truckFlags(p,t,k).length;add(t.ph,'Toupie '+t.n+' · BL '+(t.bl||'–'),fl?85:(k===0?60:35),fl?'NC':'Toupie')});
 add((p.lab||{}).ph,'Registre du laboratoire (document)',200,'Registre labo');
 (p.freePh||[]).forEach(id=>{if(PH[id])out.push({id,label:(p.freeCap&&p.freeCap[id])||'Photo supplémentaire',score:60,cat:'Libre',ord:ord++})});
 p.inc.forEach(x=>add(x.ph,'Incident '+x.t+' · '+x.cause,x.nc?100:75,x.nc?'NC':'Incident'));
 // automatic choice: best scores, at most 4 photos of non-conformity-free trucks, ties keep chronological order
 const ranked=[...out].sort((a,b)=>b.score-a.score||a.ord-b.ord);let tr=0;
 const auto=new Set();for(const x of ranked){if(auto.size>=(p.phMax||PH_MAX))break;if(x.cat==='Toupie'){if(tr>=3)continue;tr++}auto.add(x.id)}
 const sel=p.phSel||{};
 out.forEach(x=>{x.auto=auto.has(x.id);x.on=sel[x.id]!==undefined?sel[x.id]:x.auto});
 return out;
}

// volume / trucks per concrete plant: from the truck log, or from the lab register when the lab totals are entered per plant
function cenTotals(p){
 const lc=(p.lab&&p.lab.cen)||{};
 return cenList(p).map(c=>{
  const v=p.trucks.filter(t=>t.centrale===c&&t.status!=='rej');
  const tv=v.reduce((a,t)=>a+(num(t.vol)||0),0),l=lc[c]||{};
  const ln=num(l.n),lv=num(l.vol);
  return (lv!=null&&lv>=tv)?{c,n:ln!=null?ln:v.length,vol:lv,lab:true}:{c,n:v.length,vol:tv,lab:false}});
}

// ---------- item cards (shared by Prérequis and Contrôles) ----------
function thumbs(ids,own){return ids&&ids.length?`<div class="thumbs">${ids.map(id=>PH[id]?`<img src="${PH[id]}" alt="Photo" data-act="viewph" data-id="${id}">`:`<div class="ph"></div>`).join('')}</div>`:''}
function itemCard(p,i){
 const [id,text,req,tags,ph,kind]=i,s=itemState(p,id);
 const need=ph==='r'&&!(s.ph&&s.ph.length);
 let extra='';
 if(kind==='temp')extra=`<div class="grid2"><label class="f">T° ext min (°C)<input class="in" inputmode="decimal" data-chg="fld" data-id="${id}" data-k="v1" value="${esc(s.v1??'')}"></label><label class="f">T° ext max (°C)<input class="in" inputmode="decimal" data-chg="fld" data-id="${id}" data-k="v2" value="${esc(s.v2??'')}"></label></div><button class="cam" data-act="wxday" data-id="${id}" style="align-self:flex-start">Reprendre la météo du jour (réseau)</button>`;
 if(kind==='thermal')extra=`<div class="grid2"><label class="f">T max cœur (°C)<input class="in" inputmode="decimal" data-chg="thm" data-k="tmax" value="${esc(p.thermal.tmax)}"></label><label class="f">ΔT cœur / peau (°C)<input class="in" inputmode="decimal" data-chg="thm" data-k="dT" value="${esc(p.thermal.dT)}"></label></div>`;
 if(kind==='finish')extra=`<label class="f">Méthode de finition<select class="in" data-chg="fld" data-id="${id}" data-k="meth"><option value="">À choisir</option>${FINISH.map(o=>`<option${s.meth===o?' selected':''}>${esc(o)}</option>`).join('')}</select></label>`;
 const nokNoObs=(s.s==='nok'||s.s==='na')&&!(s.obs||'').trim();
 return `<div class="item${s.s?' s-'+s.s:''}"><div><p>${esc(text)}</p>${req?`<div class="req">${esc(req)}</div>`:''}</div>
 <div class="row wrap" style="gap:5px">${i[5]==='pa'?'<span class="pill pa">POINT D’ARRÊT</span>':''}${tags.map(t=>`<span class="pill tag">${t}</span>`).join('')}${ph==='r'?'<span class="pill warn">PHOTO REQUISE</span>':''}</div>
 ${extra}
 <div class="seg" role="group" aria-label="Statut">${[['ok','OUI'],['nok','NON'],['na','NA']].map(([v,l])=>`<button data-act="set" data-id="${id}" data-v="${v}" aria-pressed="${s.s===v}">${l}</button>`).join('')}</div>
 ${s.s?`<select class="in" style="min-height:38px;font:400 13px var(--f)" data-chg="isrc" data-id="${id}" aria-label="Source de l’information">${srcOpts(s.src)}</select>`:''}
 ${(s.s==='nok'||s.s==='na'||s.obs)?`<label class="f">Observation${nokNoObs?' · obligatoire (NON / NA)':''}<textarea class="in" data-chg="obs" data-id="${id}" ${nokNoObs?'style="border-color:var(--nok)"':''}>${esc(s.obs||'')}</textarea></label>`:''}
 <div class="row wrap">${thumbs(s.ph)}<button class="cam${need?' need':''}" data-act="shot" data-id="${id}">${ICON.cam}${s.ph&&s.ph.length?'Ajouter':'Photo'}</button>${s.s?'':`<button class="cam" style="border-style:solid;border-color:var(--line);color:var(--mut)" data-act="note" data-id="${id}">Note</button>`}</div>${i[6]==='x'?`<button class="cam" style="border-style:solid;border-color:var(--line);color:var(--nok);align-self:flex-start" data-act="xdel" data-id="${id}">Supprimer ce point</button>`:''}</div>`;
}

 return `<h2>Prérequis avant coulage</h2><p class="small mut" style="margin:0">Levée des points d’arrêt · CCTP §7.11.4 et fiche 9</p>${verdict}

// ---------- Coulage (live log) ----------
function pourView(p){
 p.tlog=p.tlog||[];
 const s=stats(p),th=p.th;
 if(!p.start&&!p.end){
  const open=gateOpen(p).length;
  return `<h2>Coulage</h2><div class="card" style="display:flex;flex-direction:column;gap:10px"><div>${p.go?`<span class="pill ok">AUTORISÉ ${p.go.at}</span>`:`<span class="pill ${open?'warn':'na'}">${open?open+' PRÉREQUIS OUVERTS':'ACCORD MOE À ENREGISTRER'}</span>`}</div>
  <div class="small mut">Démarrez le journal à l’arrivée de la première toupie. Les écarts (délai, affaissement, cadence) sont calculés au fil des saisies.</div>
  ${labCard(p)}${freeCard(p)}
  <button class="btn full" data-act="start">Démarrer le coulage</button><button class="btn ghost full" data-act="pres">${p.pres.from?'Ma présence : '+p.pres.from+' → '+(p.pres.to||'…'):'Ma présence sur site'}</button></div>
  <div class="card small"><b>Seuils appliqués</b><div class="mono mut" style="margin-top:4px">Débit ≥ ${th.flow} m³/h · chargement → mise en place ≤ ${hm(th.dt)} · écart toupies ≤ ${th.gap} min · affaissement ${th.slumpMin}–${th.slumpMax} mm · essai toutes les ${th.every} toupies</div></div>
  <h3>Mélanges</h3><div class="card small mono">${MIXES.assiette}<br>${MIXES.fut}</div>`;
 }
 const flowCls=s.flow==null?'':(s.flow<th.flow?'bad':'good');
 const pct=s.plan?Math.min(100,s.vol/s.plan*100):0;
 const last=p.trucks[p.trucks.length-1],nextN=p.trucks.length+1;
 const alerts=[];
 if(s.flow!=null&&s.n>=3&&s.flow<th.flow)alerts.push(['nok',`Débit moyen ${f1(s.flow)} m³/h sous le minimum de ${th.flow} m³/h`]);
 if(last){truckFlags(p,last,p.trucks.length-1).forEach(f=>alerts.push(['nok',`Toupie ${last.n} : ${f.m}`]));
  if(testDue(p,{},p.trucks.length))alerts.push(['warn',`Essai béton frais requis sur la toupie ${nextN} (affaissement, T° béton, air si gel/dégel)`])}
 else if(!s.lab)alerts.push(['warn','Essai béton frais requis sur la 1re toupie']);
 const lt=p.tlog[p.tlog.length-1],since=lt?dmin(lt.t,nowT()):null;
 if(!p.end&&(since==null||since>120))alerts.push(['warn',since==null?'Relever la T° extérieure (toutes les 2 h)':`Dernière T° extérieure il y a ${hm(since)} : relevé à faire`]);
 return `<h2>Coulage en cours</h2>
 <div class="kpis"><div class="kpi"><b>${f1(s.vol)}</b><span>m³ coulés${s.plan?' / '+f1(s.plan):''}</span></div><div class="kpi ${flowCls}"><b>${f1(s.flow)}</b><span>m³/h moyen</span></div><div class="kpi"><b>${s.n}</b><span>toupies${s.rej?' · '+s.rej+' rej.':''}</span></div></div>
 ${s.plan?`<div><div class="bar"><i style="width:${pct}%"></i></div><div class="small mut mono" style="margin-top:4px">Reste ${f1(s.left)} m³${s.eta!=null?' · fin estimée dans '+hm(s.eta):''} · début ${p.start}${p.startSrc?' ('+SRC[p.startSrc].toLowerCase()+')':''}${p.end?' · fin '+p.end+(p.endSrc?' ('+SRC[p.endSrc].toLowerCase()+')':''):''}</div></div>`:`<div class="small mut mono">Début ${p.start}${p.end?' · fin '+p.end:''}${s.el!=null?' · durée '+hm(s.el):''}</div>`}
 ${cenList(p).length>1&&cenTotals(p).some(x=>x.n||x.vol)?`<div class="card small mono">${cenTotals(p).map(x=>esc(x.c)+' : <b>'+f1(x.vol)+' m³</b> · '+x.n+' toupies'+(x.lab?' (registre labo)':'')).join('<br>')}</div>`:''}
 ${alerts.map(a=>`<div class="alert ${a[0]}"><div>${esc(a[1])}</div></div>`).join('')}
 ${labCard(p)}${freeCard(p)}
 <button class="btn ghost full" data-act="pres">${p.pres.from?'Ma présence : '+p.pres.from+' → '+(p.pres.to||'…'):'Ma présence sur site'}</button>
 ${leaveCard(p)}
 ${p.end?'':`<button class="btn ghost full" data-act="truck">＋ Constat sur une toupie (facultatif)</button>
 <div class="grid2"><button class="btn ghost" data-act="tlog">T° ext.${lt?' '+lt.v+' °C':''}</button><button class="btn ghost" data-act="inc">Incident</button></div>`}
 <h3>Toupies</h3>
 ${p.trucks.length?[...p.trucks].reverse().map(t=>truckRow(p,t)).join(''):'<p class="mut small">Aucune toupie saisie.</p>'}
 ${p.inc.length?`<h3>Interruptions et incidents</h3>${p.inc.map(x=>`<div class="card small"><div class="row"><b class="mono">${x.t}${x.dur?' · '+x.dur+' min':''}</b>${x.nc?'<span class="pill nok">NC</span>':''}</div>${esc(x.cause)}${thumbs(x.ph)}</div>`).join('')}`:''}
 ${p.tlog.length?`<h3>T° extérieure</h3><div class="card small mono">${p.tlog.map(x=>x.t+' · '+x.v+' °C').join('<br>')}</div>`:''}
 ${p.end?`<button class="btn sec full" data-act="reopen">Rouvrir le coulage</button>`:`<button class="btn sec full" data-act="end">Terminer le coulage</button>`}`;
}
function truckRow(p,t){
 const i=p.trucks.indexOf(t),fl=truckFlags(p,t,i),bad=fl.length;
 const chip=(txt,cls)=>`<span class="pill ${cls||'tag'}">${txt}</span>`;
 const fk=k=>fl.some(f=>f.k===k);
 return `<button class="truck${t.status==='rej'?' rej':''}" data-act="edtruck" data-id="${t.id}"><span class="n">${t.n}</span><b class="mono" style="font-size:13px">BL ${esc(t.bl||'–')} · ${esc(t.centrale||'–')}</b><span class="mono">${f1(num(t.vol))} m³</span>
 <span class="small mut mono" style="grid-column:2/4">${t.el==='fut'?'Fût':'Assiette + décaissé'} · arr. ${t.tarr||'–'} · charg. ${t.tload||'–'} → fin ${t.tend||'–'}</span>
 <span class="chips">${t.slump!==''&&t.slump!=null?chip('S '+t.slump+' mm',fk('slump')?'nok':'ok'):''}${t.tc?chip('Tb '+t.tc+' °C'):''}${t.air?chip('air '+t.air+' %'):''}${fk('dt')?chip('Δt '+hm(dmin(t.tload,t.tend)),'nok'):''}${fk('gap')?chip('écart toupies','nok'):''}${t.status==='rej'?chip('REJETÉE','nok'):''}${t.src?chip('déclaré','warn'):''}${t.serie?chip('série '+t.serie,'warn'):''}${(t.ph||[]).length?chip('📷 '+t.ph.length):''}</span></button>`;
}

// ---- truck sheet ----
A.truck=()=>{const p=P(),l=p.trucks[p.trucks.length-1]||{};
 D={id:uid(),n:p.trucks.length+1,bl:'',centrale:l.centrale||(p.centrales||'').split(/[,;]/)[0].trim(),el:l.el||'assiette',vol:l.vol||'',tarr:nowT(),tload:'',tend:'',slump:'',tc:'',air:'',text:'',status:'ok',serie:null,note:'',ph:[],_new:true};
 truckSheet()};
A.edtruck=t=>{D=JSON.parse(JSON.stringify(P().trucks.find(x=>x.id===t.dataset.id)));truckSheet()};
function truckSheet(){
 const p=P(),idx=D._new?p.trucks.length:p.trucks.findIndex(x=>x.id===D.id);
 const tmp=p.trucks.slice();if(D._new)tmp.push(D);else tmp[idx]=D;
 const fl=truckFlags({...p,trucks:tmp},D,idx),due=testDue({...p,trucks:tmp},D,idx);
 const free=p.series.map((x,i)=>({x,i})).filter(o=>!o.x||o.x.truck===D.n);
 openSheet(`<h2>Toupie n° ${D.n}</h2>
 <div class="grid2"><label class="f">N° bon de livraison<input class="in" data-chg="tb" data-k="bl" value="${esc(D.bl)}"></label><label class="f">Centrale${cenSelect(p,D.centrale,'data-chg="tb" data-k="centrale"')}</label></div>
 <div class="grid2"><label class="f">Élément<select class="in" data-chg="tb" data-k="el"><option value="assiette"${D.el==='assiette'?' selected':''}>Assiette + décaissé</option><option value="fut"${D.el==='fut'?' selected':''}>Fût</option></select></label><label class="f">Volume (m³)<input class="in" inputmode="decimal" data-chg="tb" data-k="vol" value="${esc(D.vol)}"></label></div>
 <div class="grid3"><label class="f">Chargement<input class="in" type="time" data-chg="tb" data-k="tload" value="${D.tload}"></label><label class="f">Arrivée<input class="in" type="time" data-chg="tb" data-k="tarr" value="${D.tarr}"></label><label class="f">Fin mise en place<input class="in" type="time" data-chg="tb" data-k="tend" value="${D.tend}"></label></div>
 <div class="row"><button class="btn ghost grow" data-act="tnow" data-k="tload">Chargement = BL</button><button class="btn ghost grow" data-act="tnow" data-k="tend">Fin = maintenant</button></div>
 <div id="tdue"></div>
 <div class="grid3"><label class="f">Affaissement (mm)<input class="in" inputmode="numeric" data-chg="tb" data-k="slump" value="${esc(D.slump)}"></label><label class="f">T° béton (°C)<input class="in" inputmode="decimal" data-chg="tb" data-k="tc" value="${esc(D.tc)}"></label><label class="f">Air occlus (%)<input class="in" inputmode="decimal" data-chg="tb" data-k="air" value="${esc(D.air)}"></label></div>
 <div id="tfl" style="display:flex;flex-direction:column;gap:8px"></div>
 <label class="f">Série d’éprouvettes prélevée<select class="in" data-chg="tb" data-k="serie"><option value="">Aucune</option>${free.map(o=>`<option value="${o.i+1}"${D.serie===o.i+1?' selected':''}>Série ${o.i+1}</option>`).join('')}</select></label>
 <label class="f">Note<textarea class="in" data-chg="tb" data-k="note">${esc(D.note)}</textarea></label>
 <label class="f">Source de la saisie<select class="in" data-chg="tb" data-k="src">${srcOpts(D.src)}</select></label>
 <div class="row wrap">${thumbs(D.ph)}<button class="cam" data-act="tshot">${ICON.cam}Photo BL / essai</button></div>
 <div class="row"><button class="btn ${D.status==='rej'?'sec':'red'} grow" data-act="trej">${D.status==='rej'?'Annuler le rejet':'Rejeter le chargement'}</button></div>
 <div class="row sf"><button class="btn sec grow" data-act="close">Annuler</button><button class="btn grow" data-act="savetruck">Enregistrer</button></div>`);tRegions()}
function tRegions(){const p=P(),idx=D._new?p.trucks.length:p.trucks.findIndex(x=>x.id===D.id);const tmp=p.trucks.slice();if(D._new)tmp.push(D);else tmp[idx]=D;const pp={...p,trucks:tmp};
 const fl=truckFlags(pp,D,idx),due=testDue(pp,D,idx),a=$('#tdue'),b=$('#tfl');
 if(a)a.innerHTML=due?`<div class="alert warn"><div>Essai béton frais requis sur cette toupie (CCTP §7.11.6.2)</div></div>`:'';
 if(b)b.innerHTML=fl.filter(f=>f.k!=='rej').map(f=>`<div class="alert nok"><div>${esc(f.m)}</div></div>`).join('')}
A.tb=t=>{const k=t.dataset.k;D[k]=k==='serie'?(t.value?parseInt(t.value):null):t.value;tRegions()};
A.tnow=t=>{D[t.dataset.k]=nowT();const sc=$('.sheet').scrollTop;truckSheet();$('.sheet').scrollTop=sc};
A.trej=()=>{D.status=D.status==='rej'?'ok':'rej';truckSheet()};
A.tshot=()=>pickPhoto('Toupie '+D.n+' BL '+D.bl,id=>{D.ph.push(id);truckSheet()});
A.savetruck=()=>{const p=P();if(num(D.vol)==null){toast('Indiquez le volume de la toupie');return}
 const clean={...D};delete clean._new;
 if(D._new)p.trucks.push(clean);else p.trucks[p.trucks.findIndex(x=>x.id===D.id)]=clean;
 p.series.forEach((x,i)=>{if(x&&x.truck===clean.n)p.series[i]=null});
 if(clean.serie)p.series[clean.serie-1]={el:clean.el,bl:clean.bl,centrale:clean.centrale,time:clean.tarr,truck:clean.n};
 closeSheet();saveLS();render()};

 <div class="alert warn"><div>Répartition CCTP : 1 série pour le fût et 7 séries pour l’assiette non déjaugée (9 si déjaugée). Le CCTP et la check-list citent aussi « 8 séries » : ajustez le nombre de séries dans les réglages si besoin.</div></div>`;

 const prev=[...p.series].reverse().find(y=>y&&y.eprs);
 DN={i,...x,eprs:JSON.parse(JSON.stringify(x.eprs||(prev&&prev.eprs)||EPR_DEF))};if(!DN.centrale)DN.centrale=cenList(p)[0]||'';

function serieSheet(){const p=P(),x=DN,i=DN.i;
 openSheet(`<h2>Série ${i+1}</h2><div class="card mono" style="font-size:15px">WTG ${esc(p.wtg)} · ${esc(x.centrale||'centrale')} · BL ${esc(x.bl||'…')} · S${i+1}</div>
 <div class="grid2"><label class="f">Élément<select class="in" data-chg="sb" data-k="el"><option value="assiette"${x.el==='assiette'?' selected':''}>Assiette + décaissé</option><option value="fut"${x.el==='fut'?' selected':''}>Fût</option></select></label><label class="f">N° BL<input class="in" data-chg="sb" data-k="bl" value="${esc(x.bl)}"></label></div>
 <label class="f">Centrale${cenSelect(p,x.centrale||cenList(p)[0]||'','data-chg="sb" data-k="centrale"')}</label>
 <b class="small">Éprouvettes de cette série : ${eprN(x)}</b>

 <div class="row wrap"><button class="btn ghost" data-act="eadd">＋ Échéance</button>${x.eprs.length>1?'<button class="btn ghost" data-act="edel">− Dernière</button>':''}</div>
 <div class="row sf"><button class="btn red grow" data-act="delserie">Vider</button><button class="btn grow" data-act="saveserie">Enregistrer</button></div>`)}
A.ea=t=>{DN.eprs[+t.dataset.k].a=t.value};A.en=t=>{DN.eprs[+t.dataset.k].n=t.value};A.er=t=>{DN.eprs[+t.dataset.k].r=t.value};
A.eadd=()=>{const used=DN.eprs.map(e=>e.a),nx=AGES.find(([v])=>!used.includes(v));DN.eprs.push({a:nx?nx[0]:'28',n:'1',r:''});serieSheet()};

A.sb=t=>{DN[t.dataset.k]=t.value};
A.saveserie=()=>{const p=P();p.series[DN.i]={el:DN.el,bl:DN.bl,centrale:DN.centrale,time:DN.time||nowT(),truck:DN.truck||null,eprs:DN.eprs.filter(e=>num(e.n)>0)};closeSheet();saveLS();render()};
A.delserie=()=>{P().series[DN.i]=null;closeSheet();saveLS();render()};

 const f=(k,l)=>`<label class="f">${l}<input class="in" inputmode="decimal" data-chg="sth" data-k="${k}" value="${th[k]}"></label>`;
 openSheet(`<h2>Réglages</h2>
 <div class="grid2"><label class="f">Projet<input class="in" data-chg="sp" data-k="project" value="${esc(p.project)}"></label><label class="f">N° éolienne<input class="in" data-chg="sp" data-k="wtg" value="${esc(p.wtg)}"></label></div>
 <div class="grid2"><label class="f">Date<input class="in" type="date" data-chg="sp" data-k="date" value="${p.date}"></label><label class="f">Rédacteur<input class="in" data-chg="sp" data-k="drafter" value="${esc(p.drafter)}"></label></div>

 <h3>Centrales à béton</h3><div class="grid3">${[0,1,2].map(i=>`<label class="f">Centrale ${i+1}${i===2?' (secours)':''}<input class="in" data-chg="scn" data-i="${i}" value="${esc(cenList(p)[i]||'')}"></label>`).join('')}</div>
 <div class="grid2"><label class="f">Volume assiette + décaissé (m³)<input class="in" inputmode="decimal" data-chg="sp" data-k="volA" value="${esc(p.volA)}"></label><label class="f">Volume fût (m³)<input class="in" inputmode="decimal" data-chg="sp" data-k="volF" value="${esc(p.volF)}"></label></div>
  <h3>Intervenants (nom · représentant sur site)</h3>
 <p class="small mut" style="margin:0">Société, nom, présence et signature de chaque intervenant se renseignent dans l’onglet Rapport.</p>

 <h3>Seuils</h3><div class="grid3">${f('flow','Débit min (m³/h)')}${f('dt','Charg.→pose (min)')}${f('gap','Écart toupies (min)')}${f('slumpMin','Affaiss. min')}${f('slumpMax','Affaiss. max')}${f('every','Essai / n toupies')}${f('tmin','T ext min')}${f('tmax','T ext max')}${f('seriesTot','Nb de séries')}</div>
 <button class="btn red full" data-act="delpour">Supprimer ce coulage</button><div class="sf"><button class="btn full" data-act="close">Fermer</button></div>`)};
A.scn=t=>{const p=P(),l=cenList(p);while(l.length<3)l.push('');l[+t.dataset.i]=t.value.trim();p.centrales=l.filter(Boolean).join(', ');saveLS();later()};

A.sth=t=>{later();const p=P(),k=t.dataset.k,v=num(t.value);if(v==null)return;p.th[k]=v;if(k==='seriesTot'){const n=Math.max(1,Math.round(v));while(p.series.length<n)p.series.push(null);p.series.length=n}saveLS();render()};

// ---------- registre du laboratoire (photo du document des toupies) ----------
function labCard(p){
 const L=p.lab=p.lab||{ph:[],n:'',vol:'',first:'',last:'',note:''};L.ph=L.ph||[];
 const has=(num(L.n)||0)+(num(L.nF)||0)>0&&(num(L.vol)||0)+(num(L.volF)||0)>0;
 return `<div class="card" style="display:flex;flex-direction:column;gap:8px"><b style="font:700 15px var(--f);color:var(--head)">Registre du laboratoire</b>
 <div class="small mut">Le laboratoire tient la liste des toupies. Photographiez son document (une photo par page) : il est joint au rapport. Vous n’avez pas à saisir chaque toupie ; il suffit de reporter les totaux.</div>
 <div class="row wrap">${thumbs(L.ph)}<button class="cam${L.ph.length?'':' need'}" data-act="labshot">${ICON.cam}${L.ph.length?'Ajouter une page':'Photographier le document'}</button></div>
 ${(()=>{const cs=Object.values(L.cen||{}).reduce((a,x)=>a+(num(x.vol)||0),0),tt=(num(L.vol)||0)+(num(L.volF)||0);return has&&cs&&Math.abs(cs-tt)>0.5?`<div class="alert warn"><div>Somme des centrales ${f1(cs)} m³ ≠ total ${f1(tt)} m³ : à vérifier.</div></div>`:''})()}
 ${has?`<div class="small mono">${labTxt(L)}${L.first&&L.last?' · de '+L.first+' à '+L.last:''}${L.note?'<br>'+esc(L.note):''}</div>`:'<div class="small mut">Totaux non renseignés.</div>'}
 <button class="btn ghost full" data-act="lab">${has?'Modifier les totaux':'Renseigner les totaux du document'}</button></div>`;
}
const labTxt=L=>[num(L.n)?`Assiette + décaissé : ${L.n} toupies · ${L.vol} m³`:'',num(L.nF)?`Fût : ${L.nF} toupies · ${L.volF} m³`:''].filter(Boolean).join(' / ');
A.labshot=()=>{const p=P();p.lab=p.lab||{ph:[]};pickPhoto('Registre labo',id=>{(p.lab.ph=p.lab.ph||[]).push(id)},{doc:true})};
A.lab=()=>{const p=P(),L=p.lab;openSheet(`<h2>Totaux du registre</h2><p class="small mut" style="margin:0">Reportez les totaux figurant sur le document du laboratoire. Ils alimentent le volume coulé, le débit moyen et le reste à couler.</p>
 <b class="small">Assiette + décaissé (fiche « Massif »)</b><div class="grid2"><label class="f">Nb de toupies<input class="in" inputmode="numeric" id="l-n" value="${esc(L.n)}"></label><label class="f">Volume (m³)<input class="in" inputmode="decimal" id="l-v" value="${esc(L.vol)}"></label></div>
 <b class="small">Fût (fiche « Fût »), si coulé</b><div class="grid2"><label class="f">Nb de toupies<input class="in" inputmode="numeric" id="l-nf" value="${esc(L.nF||'')}"></label><label class="f">Volume (m³)<input class="in" inputmode="decimal" id="l-vf" value="${esc(L.volF||'')}"></label></div>
 <div class="grid2"><label class="f">1re toupie (arrivée)<input class="in" type="time" id="l-a" value="${esc(L.first)}"></label><label class="f">Dernière toupie (fin)<input class="in" type="time" id="l-b" value="${esc(L.last)}"></label></div>
 ${cenList(p).length>1?`<b class="small">Par centrale (colonne « Centrale/BL » de la fiche)</b>${cenList(p).map((c,k)=>`<div class="grid2"><label class="f">${esc(c)}${k===2?' (secours)':''} · toupies<input class="in" inputmode="numeric" id="l-cn${k}" value="${esc(((L.cen||{})[c]||{}).n||'')}"></label><label class="f">m³<input class="in" inputmode="decimal" id="l-cv${k}" value="${esc(((L.cen||{})[c]||{}).vol||'')}"></label></div>`).join('')}`:''}
 <label class="f">Remarque<textarea class="in" id="l-c">${esc(L.note)}</textarea></label>
 <div class="row sf"><button class="btn sec grow" data-act="close">Annuler</button><button class="btn grow" data-act="dolab">Enregistrer</button></div>`)};
A.dolab=()=>{const p=P(),L=p.lab;L.n=$('#l-n').value.trim();L.vol=$('#l-v').value.trim();L.nF=$('#l-nf').value.trim();L.volF=$('#l-vf').value.trim();L.first=$('#l-a').value;L.last=$('#l-b').value;L.note=$('#l-c').value.trim();L.cen={};cenList(p).forEach((c,k)=>{const n=$('#l-cn'+k),v=$('#l-cv'+k);if(n&&(n.value||v.value))L.cen[c]={n:n.value.trim(),vol:v.value.trim()}});closeSheet();saveLS();render()};

// ---------- éprouvettes : nombre et âges libres par série ----------
const AGES=[['2','2 jours'],['3','3 jours'],['7','7 jours'],['14','14 jours'],['28','28 jours'],['56','56 jours'],['90','90 jours'],['res','Réserve (1 an)']];
const EPR_DEF=[{a:'7',n:'1',r:''},{a:'14',n:'1',r:''},{a:'28',n:'3',r:''},{a:'res',n:'3',r:''}];
const ageDays=a=>a==='res'?365:parseInt(a);
const ageLbl=a=>(AGES.find(x=>x[0]===a)||[a,a+' j'])[1];
const eprN=x=>((x&&x.eprs)||EPR_DEF).reduce((a,e)=>a+(num(e.n)||0),0);
const eprTxt=x=>((x&&x.eprs)||[]).map(e=>`${e.n}×${e.a==='res'?'rés.':e.a+' j'}${e.r?' ('+e.r+' MPa)':''}`).join(' · ')||'–';
function echeancier(p){
 const m={};p.series.filter(Boolean).forEach(x=>(x.eprs||EPR_DEF).forEach(e=>{m[e.a]=(m[e.a]||0)+(num(e.n)||0)}));
 const ages=Object.keys(m).sort((a,b)=>ageDays(a)-ageDays(b));
 if(!ages.length)return '<div class="card small mut">L’échéancier apparaît dès qu’une série est enregistrée.</div>';
 return `<div class="card"><table class="mono small" style="width:100%">${ages.map(a=>`<tr><td>${ageLbl(a)}</td><td>${m[a]} épr.</td><td><b>${fdate(addDays(p.date,ageDays(a)))}</b></td></tr>`).join('')}</table><div class="small mut" style="margin-top:6px">Résultats transmis au MOE sous 2 jours après chaque essai.</div></div>`;
}

function freeCard(p){

const SL={ok:'OUI',nok:'NON',na:'NA'};
function reportModel(p){
 const s=stats(p),nc=ncList(p),pr=progress(p);
 const rows=(items)=>items.map(i=>{const st=itemState(p,i[0]);return {id:i[0],text:i[1],req:i[2],tags:i[3].join('/'),s:st.s||'',obs:((st.src?'['+SRC[st.src]+'] ':'')+(st.obs||'')).trim(),src:st.src||'',ph:st.ph||[],pa:i[5]==='pa',v:i[5]==='finish'?(st.meth?'Méthode : '+st.meth:'Méthode non indiquée'):i[5]==='temp'?`T ext min ${st.v1||'–'} / max ${st.v2||'–'} °C`:(i[5]==='thermal'?`T max ${p.thermal.tmax||'–'} °C · ΔT ${p.thermal.dT||'–'} °C`:'')}});
 return {s,nc,pr,gate:rows(GATE),chk:CHECKS.map(([t,it])=>({t,rows:rows(it)})),
  counts:(()=>{const c={ok:0,nok:0,na:0,todo:0};ALL.forEach(i=>{const x=itemState(p,i[0]).s;c[x||'todo']++});return c})()};
}
function reportWarn(p,m){
 const c=m.counts;
 const warn=[];
 if(c.todo)warn.push(`${c.todo} point(s) non renseigné(s)`);
 const decl=ALL.filter(i=>itemState(p,i[0]).src).length;if(decl)warn.push(`${decl} point(s) déclaré(s) par un tiers (indiqué au rapport)`);
 if(pr_missing(m))warn.push(`${m.pr.missing.length} photo(s) requise(s) manquante(s)`);
 {const miss=roles(p).filter(([k])=>{const c=ctc(p,k);return (c.st||'p')==='p'&&!p.sig[k]}).length;if(miss)warn.push(`${miss} signature(s) manquante(s) (ou marquez l’intervenant absent / non concerné)`);const nn=roles(p).filter(([k])=>{const c=ctc(p,k);return (c.st||'p')!=='nc'&&!(c.n||'').trim()&&!(c.co||'').trim()}).length;if(nn)warn.push(`${nn} intervenant(s) sans nom ni société`)}
 const missObs=ALL.filter(i=>{const s=itemState(p,i[0]);return (s.s==='nok'||s.s==='na')&&!(s.obs||'').trim()}).length;
 if(missObs)warn.push(`${missObs} observation(s) NON/NA à justifier`);
 return warn;
}
function reportView(p){
 const m=reportModel(p),c=m.counts;
 const warn=reportWarn(p,m);
 const sigs=roles(p).map(([k,l])=>{const c=ctc(p,k),st=c.st||'p',cx=(p.xr||[]).some(x=>x.k===k);
  return `<div class="card" style="display:flex;flex-direction:column;gap:8px"><div class="row"><b class="grow" style="font:700 15px var(--f);color:var(--head)">${esc(l)}</b>${st==='p'&&p.sig[k]?'<span class="pill ok">SIGNÉ</span>':st==='a'?'<span class="pill warn">ABSENT</span>':st==='nc'?'<span class="pill na">N.C.</span>':''}</div>
  <div class="seg xseg" role="group" aria-label="Présence">${[['p','Présent'],['a','Absent'],['nc','Non concerné']].map(([v,t])=>`<button data-act="sst" data-r="${k}" data-v="${v}" aria-pressed="${st===v}">${t}</button>`).join('')}</div>
  <div class="grid2"><label class="f">Société<input class="in" data-chg="sc" data-r="${k}" data-k="co" value="${esc(c.co||'')}"></label><label class="f">Nom${st==='a'?' (si connu)':''}<input class="in" data-chg="sc" data-r="${k}" data-k="n" value="${esc(c.n||'')}"></label></div>
  ${st==='a'?`<label class="f">Remarque (ex. informé, non requis ce jour, visite prévue)<input class="in" data-chg="sc" data-r="${k}" data-k="why" value="${esc(c.why||'')}"></label>`:''}
  ${st==='p'?`${p.sig[k]?`<img src="${p.sig[k].img}" alt="Signature" style="height:60px;object-fit:contain;background:#fff;border-radius:6px;border:1px solid var(--line)">`:''}<button class="btn ghost" data-act="sign" data-r="${k}">${p.sig[k]?'Refaire la signature':'Signer'}</button>`:''}
  ${cx?`<button class="cam" style="border-style:solid;border-color:var(--line);color:var(--nok);align-self:flex-start" data-act="xrdel" data-r="${k}">Retirer cet intervenant</button>`:''}</div>`}).join('');
 return `<h2>Rapport de coulage</h2>
 <div class="kpis"><div class="kpi good"><b>${c.ok}</b><span>conformes</span></div><div class="kpi ${m.nc.length?'bad':''}"><b>${m.nc.length}</b><span>non-conf.</span></div><div class="kpi"><b>${c.todo}</b><span>à renseigner</span></div></div>
 <div class="card small">${esc(summaryLine(p,m))}</div>

 <h3>Livrables à récupérer</h3><div class="card" style="display:flex;flex-direction:column;gap:10px">${DELIV.map(([id,l,n,r])=>`<label class="row" style="gap:10px;align-items:flex-start"><input type="checkbox" data-chg="dv" data-id="${id}" ${(p.deliv||{})[id]?'checked':''} style="width:22px;height:22px;margin-top:1px;flex:none"><span class="grow">${esc(l)}<br><span class="small mut">${n!=null?'avant le '+fdate(addDays(p.date,n)):'selon demande / planning'} · ${esc(r)}</span></span></label>`).join('')}</div>
 ${photoPicker(p)}
 <label class="f">Commentaires généraux / fiches de non-conformité ouvertes<textarea class="in" data-chg="cm" style="min-height:90px">${esc(p.comments)}</textarea></label>
 <h3>Intervenants et signatures</h3>${sigs}
 <button class="btn ghost full" data-act="xradd">＋ Ajouter un intervenant</button>

const pr_missing=m=>m.pr.missing.length>0;
A.dv=t=>{const p=P();p.deliv=p.deliv||{};p.deliv[t.dataset.id]=t.checked;saveLS()};

function reportHTML(p,m){
 const s=m.s,row=r=>`<tr><td>${esc(r.text)}${r.v?'<br><i>'+esc(r.v)+'</i>':''}${r.req?'<br><small>'+esc(r.req)+'</small>':''}</td><td>${r.s?SL[r.s]:'–'}</td><td>${esc(r.obs)}${r.ph.length?' ['+r.ph.length+' photo(s)]':''}</td></tr>`;

 <h4>Prérequis</h4>${tab(m.gate)}${m.chk.map(c=>`<h4>${esc(c.t)}</h4>${tab(c.rows)}`).join('')}
 <h4>Journal des toupies</h4><div class="tw"><table><tr><th>N°</th><th>BL</th><th>Élém.</th><th>m³</th><th>Arr.</th><th>Fin</th><th>S mm</th><th>Tb</th></tr>${p.trucks.map(t=>`<tr><td>${t.n}</td><td>${esc(t.bl)}</td><td>${t.el==='fut'?'Fût':'Ass.'}</td><td>${esc(t.vol)}</td><td>${t.tarr||''}</td><td>${t.tend||''}</td><td>${esc(t.slump)}</td><td>${esc(t.tc)}</td></tr>`).join('')}</table></div>

// ---------- signature pad ----------
A.sign=t=>{const k=t.dataset.r,l=roles(P()).find(r=>r[0]===k)[1];
 openSheet(`<h2>Signature · ${l}</h2><canvas class="sigpad" id="sig" width="600" height="240"></canvas><div class="row sf"><button class="btn ghost grow" data-act="sigclr">Effacer</button><button class="btn sec grow" data-act="close">Annuler</button><button class="btn grow" data-act="sigok" data-r="${k}">Valider</button></div>`);
 const c=$('#sig'),x=c.getContext('2d');x.lineWidth=4;x.lineCap='round';x.strokeStyle='#111';let dn=false,any=false;
 const pt=e=>{const r=c.getBoundingClientRect();return [(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
 c.onpointerdown=e=>{dn=true;any=true;c.setPointerCapture(e.pointerId);const [a,b]=pt(e);x.beginPath();x.moveTo(a,b)};
 c.onpointermove=e=>{if(!dn)return;const [a,b]=pt(e);x.lineTo(a,b);x.stroke()};
 c.onpointerup=()=>{dn=false};c.ofSig=()=>any;};
A.sigclr=()=>{const c=$('#sig');c.getContext('2d').clearRect(0,0,c.width,c.height);c.dataset.cleared='1';c.ofSig=()=>false};
A.sigok=t=>{const c=$('#sig');if(!c.ofSig||!c.ofSig()){toast('Signez dans le cadre');return}
 const p=P();p.sig[t.dataset.r]={img:c.toDataURL('image/png'),at:fdate(today())+' '+nowT()};closeSheet();saveLS();render()};

async function saveBlob(o){

 try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:o.filename});return}}catch(e){if(e&&e.name==='AbortError')throw {code:'declined'}}

}
